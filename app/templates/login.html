{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar na Conta | BURGA RUA</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@700;800&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>

  <!-- Cabeçalho -->
  <header class="header-site">
    <div class="container header-site__wrapper">
      <a href="{% url 'home' %}" class="logo-marca" aria-label="BURGA RUA Início">
        <div class="logo-marca__icone">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M4 11a8 8 0 0 1 16 0H4z"></path>
            <path d="M4 15h16"></path>
          </svg>
        </div>
        <span class="logo-marca__nome">BURGA RUA</span>
      </a>
      <a href="{% url 'home' %}" class="btn btn--secundario btn-continuar-compras">
        ← Voltar ao cardápio
      </a>
    </div>
  </header>

  <main class="auth-wrapper">
    <div class="auth-card">
      <span class="badge-rotulo">Acesso</span>
      <h1>Entrar na sua conta</h1>
      <p>Acompanhe os seus pedidos e finalize compras com maior rapidez.</p>

      <form method="POST" action="{% url 'login' %}">
        {% csrf_token %}
        
        <div class="campo-grupo">
          <label for="id_username">Usuário</label>
          <input type="text" name="username" id="id_username" placeholder="Seu usuário" required autofocus>
        </div>

        <div class="campo-grupo">
          <label for="id_password">Senha</label>
          <input type="password" name="password" id="id_password" placeholder="Sua senha" required>
        </div>

        <button type="submit" class="btn btn--primario">Entrar</button>
      </form>

      <div class="auth-rodape">
        Ainda não tem conta? <a href="{% url 'cadastro' %}">Cadastre-se</a>
      </div>
    </div>
  </main>

</body>
</html>
