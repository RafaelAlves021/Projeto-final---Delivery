{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ produto.nome }} | BURGA RUA</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@700;800&amp;display=swap" rel="stylesheet">
  
  <!-- CSS global externo -->
  <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>

  <!-- Cabeçalho de Navegação -->
  <header class="header-site">
    <div class="container header-site__wrapper">
      <a href="{% url 'home' %}" class="logo-marca">
        <div class="logo-marca__icone">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M4 11a8 8 0 0 1 16 0H4z"></path>
            <path d="M4 15h16"></path>
          </svg>
        </div>
        <span class="logo-marca__nome">BURGA RUA</span>
      </a>
      <a href="{% url 'home' %}" class="btn btn--secundario" style="padding: 8px 18px; font-size: 0.9rem;">
        ← Voltar ao cardápio
      </a>
    </div>
  </header>

  <!-- Área de Detalhes do Produto -->
  <main class="container-detalhe">
    <a href="{% url 'home' %}" class="voltar-link">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
      Voltar para o cardápio
    </a>

    <div class="detalhe-card">
      <div class="detalhe-media">
        <img src="{{ produto.imagem_url }}" alt="{{ produto.nome }}">
      </div>
      <div class="detalhe-info">
        {% if produto.badge %}
          <span class="badge-rotulo">{{ produto.badge }}</span>
        {% endif %}
        <h1>{{ produto.nome }}</h1>
        <div class="detalhe-preco">R$ {{ produto.preco }}</div>
        <p class="detalhe-desc">{{ produto.descricao }}</p>

        <a href="{% url 'home' %}" class="btn btn--primario" style="width: 100%; padding: 18px; text-decoration: none;">
          Adicionar ao Pedido • R$ {{ produto.preco }}
        </a>
      </div>
    </div>
  </main>

</body>
</html>
